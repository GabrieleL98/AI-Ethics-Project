# config.yml
# ==========

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
dataset:
  path: "loan_approval_dataset.csv"
  target_col: "Loan_Approval_Status"
  sensitive_cols:
    - "Gender_Male" 
    - "Age_Group"
  positive_label: 1
  drop_cols: []

# ---------------------------------------------------------------------------
# Bias Detection (Stage 1)
# ---------------------------------------------------------------------------
bias_detection:
  enabled: true
  output_path: "reports/bias_report.json"
  p_threshold: 0.05
  proxy_threshold: 0.30
  representation_gap: 0.05

  benchmarks:
    Gender_Male:
      1: 0.50 
      0: 0.50  

# ---------------------------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------------------------
preprocessing:
  binning:
    - column: "Age"
      bins: [0, 25, 35, 45, 55, 65, .inf]
      labels: ["0-25", "26-35", "36-45", "46-55", "56-65", "65+"]
      new_column: "Age_Group"

# ---------------------------------------------------------------------------
# Transformers
# ---------------------------------------------------------------------------
transformers:

  - name: "disparate_impact_remover"
    enabled: true
    class: "DisparateImpactRemover"
    params:
      sensitive_col: "Gender_Male"
      repair_level: 0.8
      # Nota: Assicurati che features_to_repair non includa Gender_Male stesso
      features_to_repair: ["Annual_Income", "Credit_Score"]

  - name: "correlation_suppressor"
    enabled: true
    class: "CorrelationSuppressor"
    params:
      sensitive_col: "Gender_Male"
      threshold: 0.30
      method: "auto"

  - name: "instance_reweighting"
    enabled: true
    class: "InstanceReweighting"
    params:
      sensitive_col: "Gender_Male"
      target_col: "Loan_Approval_Status"
      normalise: true

# ---------------------------------------------------------------------------
# Classifier
# ---------------------------------------------------------------------------
classifier:
  class: "LogisticRegression"
  params:
    random_state: 42
    max_iter: 500
    class_weight: "balanced"

# ---------------------------------------------------------------------------
# CI/CD Fairness Gates
# Thresholds used by pytest (TestCICDThresholds) and assert_fairness().
# ---------------------------------------------------------------------------
fairness_gates:
  max_representation_gap: 0.10        # max allowed group representation gap
  max_proxy_correlation: 0.60         # max allowed feature-sensitive correlation
  max_disparate_feature_rate: 0.70    # max fraction of features that may be disparate
  min_reweighting_balance_ratio: 0.85 # min ratio of group weight sums after reweighting