name: Fairness CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main"]

jobs:
  fairness-check:
    name: Run Fairness Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fairness test suite
        run: |
          pytest tests/test_pipeline_fairness.py \
            --tb=short \
            --strict-markers \
            -v \
            --junitxml=reports/fairness_results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fairness-test-report
          path: reports/fairness_results.xml
          retention-days: 30

      - name: Upload bias report (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bias-report
          path: bias_report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Comment PR with summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ⚠️ Fairness CI Failed\n\nOne or more fairness threshold checks failed on this PR.\nPlease review the **fairness-test-report** artifact for details before merging.'
            })